services:
  depu-img-mcp:
    build: .
    image: depu-img-mcp:latest
    container_name: depu-img-mcp
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - WEB_ENABLED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Run as non-root; set to your host user's uid/gid so files in ./conf and
      # ./data are owned by you (find yours with `id -u` / `id -g`). Default 1000.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Mount a directory, not a single file. On first start the host dir is
      # empty; the entrypoint seeds config.toml from the bundled default.
      # Mounting a single file breaks when it doesn't exist yet (Docker turns it
      # into a directory and the server crashes on read).
      - ./conf:/app/conf
      # Optional persistence (logs, cache).
      - ./data:/app/data
    restart: unless-stopped
