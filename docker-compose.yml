services:
  depu-img-mcp:
    build: .
    image: depu-img-mcp:latest
    container_name: depu-img-mcp
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - WEB_ENABLED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      # Override config without rebuilding the image.
      - ./config.toml:/app/config.toml:ro
      # Optional persistence (logs, cache).
      - ./data:/app/data
    restart: unless-stopped
