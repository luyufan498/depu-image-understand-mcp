[project]
name = "depu-img-mcp"
version = "0.1.0"
description = "Image understanding MCP server — bridges text-only LLMs to vision models via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomli>=2.0; python_version < '3.11'",
    # web admin (lightweight, same process)
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
depu-img-mcp = "depu_img_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depu_img_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
